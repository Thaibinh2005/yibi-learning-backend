# ============================================================
#  Yibi Backend — Application Configuration
#  Environment: LOCAL DEVELOPMENT (Docker Compose)
# ============================================================

spring:
  application:
    name: yibi-backend

  # ── PostgreSQL DataSource ────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yibi_db}
    username: ${DB_USERNAME:yibi_user}
    password: ${DB_PASSWORD:yibi_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: YibiHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only validates
    show-sql: false
    open-in-view: false           # Disable OSIV for better performance
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 25

  # ── Flyway — Database Migrations ─────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: true

  # ── Redis ────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:yibi_redis_secret}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ── Jackson JSON ─────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Gemini is called only by the backend. Keep keys in environment variables.
app:
  gemini:
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-3.5-flash-lite}

# ── Server ──────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── JWT Configuration ────────────────────────────────────────
#    Secret must be ≥ 256 bits (32 chars) for HS256
jwt:
  secret: ${JWT_SECRET:yibi-secure-jwt-secret-key-at-least-32-chars-2026-development}
  access-token-expiration: 900000       # 15 minutes (ms)
  refresh-token-expiration: 604800000   # 7 days (ms)

# ── MinIO (Self-hosted S3-compatible Storage) ────────────────
minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ROOT_USER:yibi_minio_admin}
  secret-key: ${MINIO_ROOT_PASSWORD:yibi_minio_secret123}
  bucket-name: yibi-audio
  region: us-east-1

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.yibi: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

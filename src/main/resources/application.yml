# ============================================================
#  Yibi Backend — Application Configuration
#  Environment: LOCAL DEVELOPMENT (Docker Compose)
# ============================================================

spring:
  application:
    name: yibi-backend

  # SMTP and Google settings live in their own git-ignored file, next to the backend or one folder up.
  # Real environment variables still win over it. See .env.auth.example.
  config:
    import:
      - optional:file:./.env.auth[.properties]
      - optional:file:../.env.auth[.properties]

  # ── PostgreSQL DataSource ────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yibi_db}
    username: ${DB_USERNAME:yibi_user}
    password: ${DB_PASSWORD:yibi_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: YibiHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only validates
    show-sql: false
    open-in-view: false           # Disable OSIV for better performance
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 25

  # ── Flyway — Database Migrations ─────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: true

  # ── Redis ────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:yibi_redis_secret}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ── Email (forgot password). SMTP_USERNAME and SMTP_PASSWORD come from .env.auth ──
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  # ── Jackson JSON ─────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # A short recording of one sentence; the speaking question uploads it.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Gemini is called only by the backend. Keep keys in environment variables.
app:
  # Address of the web app, used in emailed links and after Google sign-in.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:}
  # Google OAuth 2.0. GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET come from .env.auth.
  # redirect-uri must be listed exactly under "Authorized redirect URIs" in Google Cloud Console.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
    auth-uri: ${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
  gemini:
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-3.5-flash-lite}
  # yibi-speech-service scores how well a learner read a sentence aloud.
  speech:
    base-url: ${SPEECH_SERVICE_URL:http://localhost:8001}
    pass-accuracy: ${SPEECH_PASS_ACCURACY:0.7}

# ── Server ──────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ── JWT Configuration ────────────────────────────────────────
#    Secret must be ≥ 256 bits (32 chars) for HS256
jwt:
  secret: ${JWT_SECRET:yibi-secure-jwt-secret-key-at-least-32-chars-2026-development}
  access-token-expiration: 900000       # 15 minutes (ms)
  refresh-token-expiration: 604800000   # 7 days (ms)

# ── MinIO (Self-hosted S3-compatible Storage) ────────────────
minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ROOT_USER:yibi_minio_admin}
  secret-key: ${MINIO_ROOT_PASSWORD:yibi_minio_secret123}
  bucket-name: yibi-audio
  region: us-east-1

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.yibi: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
